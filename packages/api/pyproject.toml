[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oxly-api"
version = "0.1.0-alpha"
description = "Oxly API Server — FastAPI backend for trace ingestion and analytics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Oxly Contributors" },
]
keywords = ["ai", "agents", "observability", "api", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.6",
    "mcp>=2.2.0",
    "standardwebhooks>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.26.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/oxly/oxly"
Documentation = "https://github.com/oxly/oxly/tree/main/docs"
Repository = "https://github.com/oxly/oxly"
Issues = "https://github.com/oxly/oxly/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
# B008: FastAPI's Depends()/Query() in defaults is the framework's documented idiom.
# TC001/TC002/TC003: annotations are evaluated at runtime (no future import in
# routes; FastAPI resolves hints via get_type_hints), so moving these imports
# into TYPE_CHECKING blocks would raise NameError on startup.
ignore = ["E501", "B008", "TC001", "TC002", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
